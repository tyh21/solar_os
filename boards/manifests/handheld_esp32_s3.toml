schema = 1

[board]
id = "handheld_esp32_s3"
name = "Handheld ESP32-S3"
vendor = "LCSC"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "handheld_esp32_s3"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_st7789",
  "i2c_esp_idf",
  "spi_esp_idf",
  "audio_es8311_es7210",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
  "pointer_ft6336",
  "storage_sdmmc",
]
capabilities = [
  "streaming_display",
  "psram", "simd", "display", "gfx", "display_brightness", "pointer",
  "cdc", "uart", "sd", "i2c", "spi", "audio",
  "audio_input", "wifi", "ble", "gpio", "adc", "pwm",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm", "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7789"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "240"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "240"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "80000000"
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0x00"
SOLAR_OS_BOARD_DISPLAY_SPI_MODE = "2"
SOLAR_OS_BOARD_DISPLAY_INVERT_COLORS = "1"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_NC"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_42"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_41"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_40"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_NC"
SOLAR_OS_BOARD_PIN_LCD_TE = "GPIO_NUM_NC"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM_FREQ_HZ = "5000U"
SOLAR_OS_BOARD_SPI_HOST = "SPI3_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_41"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_NC"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_40"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_2"
SOLAR_OS_BOARD_PCA9557_I2C_BUS = '"i2c0"'
SOLAR_OS_BOARD_PCA9557_I2C_ADDR = "0x19"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_47"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_48"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_21"
SOLAR_OS_BOARD_I2S_PORT = "I2S_NUM_0"
SOLAR_OS_BOARD_PIN_I2S_MCLK = "GPIO_NUM_38"
SOLAR_OS_BOARD_PIN_I2S_BCLK = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_I2S_WS = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_I2S_DIN = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_I2S_DOUT = "GPIO_NUM_45"
SOLAR_OS_BOARD_AUDIO_CODEC_OUT = '"ES8311"'
SOLAR_OS_BOARD_AUDIO_CODEC_IN = '"ES7210"'
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"

[runtime]
spi_hosts = []
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI3_HOST"
sclk = 41
mosi = 40
cs = []
max_transfer_size = 4096

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 1
scl = 2
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "st7789"
name = "display0"
bindings = { spi = "spi0", dc = 39, bl = 42, active = 0, pwm = 1 }

[[devices]]
driver = "ft6336"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x38, rotation = 1 }

[[devices]]
driver = "es8311-es7210"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 38, bck = 14, ws = 13, din = 12, dout = 45, addr = 0x41 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 47, cmd = 48, d0 = 21 }

[[pins]]
gpio = 0
policy = "fixed"
role = "BOOT/download / KEY"
[[pins]]
gpio = 1
policy = "fixed"
role = "I2C SDA"
