schema = 1

[board]
id = "waveshare_esp32_s3_touch_lcd_3_5b"
name = "Waveshare ESP32-S3-Touch-LCD-3.5B"
vendor = "Waveshare"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "waveshare_esp32_s3_touch_lcd_3_5b"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "wave35b_core",
  "display_axs15231b",
  "i2c_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
  "pointer_axs15231b",
  "audio_es8311_duplex",
  "storage_sdmmc",
  "rtc_pcf85063",
]
capabilities = [
  "streaming_display",
  "psram", "simd", "display", "gfx", "display_brightness", "pointer",
  "cdc", "uart", "sd", "i2c", "audio", "audio_input", "key",
  "wifi", "ble", "gpio", "adc", "pwm",
  "expansion_gpio", "expansion_i2c", "expansion_adc", "expansion_pwm",
  "expansion_i2s", "expansion_uart",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"AXS15231B"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "480"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "40000000"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_DISPLAY_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_6"
SOLAR_OS_BOARD_PIN_LCD_SCLK = "GPIO_NUM_5"
SOLAR_OS_BOARD_PIN_LCD_DATA0 = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_LCD_DATA1 = "GPIO_NUM_2"
SOLAR_OS_BOARD_PIN_LCD_DATA2 = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_LCD_DATA3 = "GPIO_NUM_4"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM_FREQ_HZ = "25000U"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_7"
SOLAR_OS_BOARD_I2S_PORT = "I2S_NUM_0"
SOLAR_OS_BOARD_PIN_I2S_MCLK = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_I2S_BCLK = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_I2S_WS = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_I2S_DIN = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_I2S_DOUT = "GPIO_NUM_16"
SOLAR_OS_BOARD_AUDIO_CODEC_OUT = '"ES8311"'
SOLAR_OS_BOARD_AUDIO_CODEC_IN = '"ES8311"'
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_10"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_NC"

[runtime]
spi_hosts = []
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 8
scl = 7
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[devices]]
driver = "wave35b-core"
name = "core0"
bindings = { i2c = "i2c0", pmic = 0x34, expander = 0x20 }

[[devices]]
driver = "axs15231b"
name = "display0"
bindings = { cs = 12, bl = 6, active = 1, pwm = 1 }

[[devices]]
driver = "axs15231b-touch"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x3B, rotation = 1 }

[[devices]]
driver = "es8311-duplex"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 44, bck = 13, ws = 15, din = 14, dout = 16 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 11, cmd = 10, d0 = 9 }

[[devices]]
driver = "pcf85063"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51 }

[[pins]]
gpio = 0
policy = "fixed"
role = "BOOT/download / KEY"
[[pins]]
gpio = 1
policy = "fixed"
role = "LCD DATA0"
[[pins]]
gpio = 2
policy = "fixed"
role = "LCD DATA1"
[[pins]]
gpio = 3
policy = "fixed"
role = "LCD DATA2"
[[pins]]
gpio = 4
policy = "fixed"
role = "LCD DATA3"
[[pins]]
gpio = 5
policy = "fixed"
role = "LCD SCLK"
[[pins]]
gpio = 6
policy = "fixed"
role = "LCD backlight"
[[pins]]
gpio = 7
policy = "fixed"
role = "I2C SCL"
[[pins]]
gpio = 8
policy = "fixed"
role = "I2C SDA"
[[pins]]
gpio = 9
policy = "fixed"
role = "SDMMC D0"
[[pins]]
gpio = 10
policy = "fixed"
role = "SDMMC CMD"
[[pins]]
gpio = 11
policy = "fixed"
role = "SDMMC CLK"
[[pins]]
gpio = 12
policy = "fixed"
role = "LCD CS"
[[pins]]
gpio = 13
policy = "fixed"
role = "audio BCLK"
[[pins]]
gpio = 14
policy = "fixed"
role = "audio DIN"
[[pins]]
gpio = 15
policy = "fixed"
role = "audio WS"
[[pins]]
gpio = 16
policy = "fixed"
role = "audio DOUT"
[[pins]]
gpio = 19
policy = "fixed"
role = "USB D-"
[[pins]]
gpio = 20
policy = "fixed"
role = "USB D+"
[[pins]]
gpio = 43
policy = "fixed"
role = "UART TX (console log, RX unavailable: GPIO44 wired to audio MCLK)"
[[pins]]
gpio = 44
policy = "fixed"
role = "audio MCLK"
